# Builds the downloadable apps. Run it from the Actions tab ("Run workflow"),
# or push a tag like v0.3.0 to also publish them as a GitHub Release.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ClipForge-Windows
          - os: macos-latest
            artifact: ClipForge-Mac
          - os: ubuntu-22.04
            artifact: ClipForge-Linux
    runs-on: ${{ matrix.os }}
    env:
      CLIPFORGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.3.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview

      - name: Fetch ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-src
          New-Item -ItemType Directory -Force packaging/ffmpeg | Out-Null
          Get-ChildItem ffmpeg-src -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination packaging/ffmpeg

      - name: Fetch ffmpeg (Mac)
        if: runner.os == 'macOS'
        run: |
          mkdir -p packaging/ffmpeg
          # Static Apple-silicon builds (with libass for captions) from ffmpeg.martin-riedl.de
          for tool in ffmpeg ffprobe; do
            curl -fsSL --retry 3 "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/$tool.zip" -o "$tool.zip"
            unzip -o "$tool.zip" -d packaging/ffmpeg
          done
          file packaging/ffmpeg/*
          chmod +x packaging/ffmpeg/*

      - name: Fetch ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz
          mkdir -p ffmpeg-src packaging/ffmpeg && tar -xf ffmpeg.tar.xz -C ffmpeg-src --strip-components=1
          cp ffmpeg-src/ffmpeg ffmpeg-src/ffprobe packaging/ffmpeg/

      - name: Check bundled ffmpeg can draw captions
        shell: bash
        run: packaging/ffmpeg/ffmpeg -hide_banner -filters | grep -w ass

      - name: Build app
        run: pyinstaller --noconfirm packaging/clipforge.spec

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc packaging/windows-installer.iss
          Move-Item dist/ClipForge-Setup.exe "${{ matrix.artifact }}-Setup.exe"

      - name: Package (Mac disk image)
        if: runner.os == 'macOS'
        run: |
          mkdir dmg && cp -R dist/ClipForge.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname ClipForge -srcfolder dmg -ov -format UDZO "${{ matrix.artifact }}.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.artifact }}.tar.gz" -C dist ClipForge

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}-Setup.exe
            ${{ matrix.artifact }}.dmg
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}-Setup.exe
            ${{ matrix.artifact }}.dmg
            ${{ matrix.artifact }}.tar.gz

  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests
