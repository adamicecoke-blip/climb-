[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.2.0"
description = "AI short-form video generator: auto-clip long videos and make story videos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.3.0", "faster-whisper>=1.0", "edge-tts>=7.0", "fastapi>=0.110", "uvicorn>=0.29",
  "python-multipart>=0.0.9", "opencv-python-headless>=4.9,<5", "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
desktop = ["pywebview>=5"]

[project.scripts]
clipforge = "clipforge.__main__:main"

[project.gui-scripts]
clipforge-app = "clipforge.desktop:main"

[tool.setuptools]
packages = ["clipforge"]

[tool.setuptools.package-data]
clipforge = ["static/*", "static/icons/*"]
